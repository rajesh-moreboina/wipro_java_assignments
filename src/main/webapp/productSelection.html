<!DOCTYPE html>
<html>
<head>
    <title>Select Items to Add to Cart</title>
</head>
<body>
    <h2>Select Items</h2>
    <form action="AddToCartServlet" method="post">
        <input type="checkbox" name="item" value="Laptop"> Laptop<br>
        <input type="checkbox" name="item" value="Smartphone"> Smartphone<br>
        <input type="checkbox" name="item" value="Headphones"> Headphones<br>
        <input type="checkbox" name="item" value="Camera"> Camera<br><br>
        <input type="submit" value="Add to Cart">
    </form>

    <br>
    <a href="ViewCartServlet">View Cart</a>
</body>
</html>
