<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Grocery Order</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        fieldset {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
        }
        legend {
            font-weight: bold;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, textarea, select {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
        }
        .inline {
            display: inline-block;
            width: auto;
        }
        button {
            margin-top: 15px;
            padding: 8px 15px;
            font-size: 1em;
        }
    </style>
</head>
<body>

    <h2>Online Grocery Order</h2>

    <form action="order.php" method="POST">
        
        <!-- Customer Details -->
        <fieldset>
            <legend>Customer Details</legend>
            
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="fullname" placeholder="Enter your full name" required autofocus>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="10-digit number" pattern="[0-9]{10}" required>

            <label for="address">Delivery Address:</label>
            <textarea id="address" name="address" placeholder="Enter your delivery address" required></textarea>
        </fieldset>

        <!-- Order Details -->
        <fieldset>
            <legend>Order Details</legend>
            
            <label>Grocery Items:</label>
            <input type="checkbox" name="items[]" value="Rice"> Rice
            <input type="checkbox" name="items[]" value="Milk"> Milk
            <input type="checkbox" name="items[]" value="Bread"> Bread
            <input type="checkbox" name="items[]" value="Eggs"> Eggs
            <input type="checkbox" name="items[]" value="Sugar"> Sugar

            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" max="10" required>

            <label for="date">Delivery Date:</label>
            <input type="date" id="date" name="delivery_date" required>

            <label for="time">Preferred Delivery Time:</label>
            <input type="time" id="time" name="delivery_time">

            <label>Payment Method:</label>
            <input type="radio" name="payment" value="Cash on Delivery" required> Cash on Delivery
            <input type="radio" name="payment" value="UPI"> UPI
            <input type="radio" name="payment" value="Card"> Card

            <label for="instructions">Special Instructions:</label>
            <textarea id="instructions" name="instructions" placeholder="Any special instructions (optional)"></textarea>
        </fieldset>

        <!-- Confirmation -->
        <label>
            <input type="checkbox" name="confirm" required> I confirm my order
        </label>

        <!-- Buttons -->
        <br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
