<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tirupati Temple Darshan Booking Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f8f9fa;
    }
    .card {
      max-width: 700px;
      margin: 40px auto;
      border-radius: 1rem;
      padding: 2rem;
    }
    .temple-logo {
      display: block;
      max-width: 120px;
      margin: 0 auto 1rem;
      border-radius: 0.25rem;
      box-shadow: 0 4px 8px rgb(0 0 0 / 0.2);
    }
    h2.form-title {
      text-align: center;
      font-weight: 700;
      margin-bottom: 2rem;
      color: #d17b00;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-shadow: 1px 1px 1px #a05f00;
    }
  </style>
</head>
<body>

<div class="card shadow">
  <!-- Tirupati Balaji Logo from Redbubble (direct image link) -->
  <img
    src="https://ih1.redbubble.net/image.4568182434.1380/bg,f8f8f8-flat,750x,075,f-pad,750x1000,f8f8f8.jpg"
    alt="Tirupati Balaji Logo"
    class="temple-logo"
  />
  <h2 class="form-title">Tirupati Temple Darshan Booking Form</h2>

  <form id="bookingForm" novalidate>
    <div class="row g-3">
      <!-- Full Name -->
      <div class="col-12">
        <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required />
        <div class="invalid-feedback">Please enter your full name.</div>
      </div>

      <!-- Email Address -->
      <div class="col-12">
        <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <!-- Mobile Number with country code -->
      <div class="col-md-6">
        <label for="mobile" class="form-label">Mobile Number <span class="text-danger">*</span></label>
        <div class="input-group has-validation">
          <span class="input-group-text">+91</span>
          <input
            type="tel"
            class="form-control"
            id="mobile"
            placeholder="10-digit mobile number"
            pattern="^\d{10}$"
            required
          />
          <div class="invalid-feedback">Please enter a valid 10-digit mobile number.</div>
        </div>
      </div>

      <!-- Gender -->
      <div class="col-md-6">
        <label class="form-label d-block">Gender</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="male" value="Male" />
          <label class="form-check-label" for="male">Male</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="female" value="Female" />
          <label class="form-check-label" for="female">Female</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="other" value="Other" />
          <label class="form-check-label" for="other">Other</label>
        </div>
      </div>

      <!-- Darshan Date -->
      <div class="col-md-6">
        <label for="darshanDate" class="form-label">Darshan Date</label>
        <input type="date" class="form-control" id="darshanDate" />
      </div>

      <!-- Darshan Time Slot -->
      <div class="col-md-6">
        <label for="timeSlot" class="form-label">Darshan Time Slot</label>
        <select id="timeSlot" class="form-select">
          <option selected disabled>Select Time Slot</option>
          <option>Morning</option>
          <option>Afternoon</option>
          <option>Evening</option>
        </select>
      </div>

      <!-- Number of Tickets (form-floating) -->
      <div class="col-md-6">
        <div class="form-floating">
          <input type="number" class="form-control" id="tickets" min="1" max="10" value="1" />
          <label for="tickets">Number of Tickets (1-10)</label>
        </div>
      </div>

      <!-- Seva Type (Checkboxes) -->
      <div class="col-md-6">
        <label class="form-label d-block">Seva Type</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="Archana" id="archana" />
          <label class="form-check-label" for="archana">Archana</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="Abhishekam" id="abhishekam" />
          <label class="form-check-label" for="abhishekam">Abhishekam</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="Special Entry Darshan" id="specialEntry" />
          <label class="form-check-label" for="specialEntry">Special Entry Darshan</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="Suprabhata Seva" id="suprabhata" />
          <label class="form-check-label" for="suprabhata">Suprabhata Seva</label>
        </div>
      </div>

      <!-- ID Proof Upload with tooltip -->
      <div class="col-12">
        <label for="idProof" class="form-label">
          ID Proof Upload
          <span
            data-bs-toggle="tooltip"
            data-bs-placement="right"
            title="Upload a clear image or PDF of your ID proof."
            style="cursor: pointer;"
            >&#9432;</span
          >
        </label>
        <input class="form-control" type="file" id="idProof" accept="image/*,application/pdf" />
      </div>

      <!-- Address -->
      <div class="col-12">
        <label for="address" class="form-label">Address</label>
        <textarea
          class="form-control"
          id="address"
          rows="3"
          placeholder="Enter your address"
        ></textarea>
      </div>

      <!-- Buttons -->
      <div class="col-12 d-grid gap-2">
        <button type="submit" class="btn btn-primary btn-lg">Submit</button>
        <button type="reset" class="btn btn-secondary btn-lg">Reset</button>
      </div>
    </div>
  </form>
</div>

<!-- Confirmation Modal -->
<div
  class="modal fade"
  id="confirmationModal"
  tabindex="-1"
  aria-labelledby="confirmationModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 shadow">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmationModalLabel">Booking Confirmed</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">Your Tirupati Darshan Booking is Confirmed!</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Enable Bootstrap tooltips
  const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
  tooltipTriggerList.forEach((tooltipTriggerEl) => {
    new bootstrap.Tooltip(tooltipTriggerEl);
  });

  // Form validation and modal on submit
  (function () {
    const form = document.getElementById('bookingForm');
    const modal = new bootstrap.Modal(document.getElementById('confirmationModal'));

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      event.stopPropagation();

      if (form.checkValidity()) {
        modal.show();
        form.reset();
        form.classList.remove('was-validated');
      } else {
        form.classList.add('was-validated');
      }
    });
  })();
</script>

</body>
</html>
