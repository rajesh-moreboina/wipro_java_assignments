<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Booking Form</title>
</head>
<body>
  <h2>Tour Booking Form</h2>

  <form onsubmit="bookTour(event)">
    <label>Full Name:</label>
    <input type="text" id="name" required><br><br>

    <label>Email:</label>
    <input type="email" id="email" required><br><br>

    <label>Destination:</label>
    <select id="destination" required>
      <option value="Ooty">Ooty</option>
      <option value="Goa">Goa</option>
      <option value="Manali">Manali</option>
    </select><br><br>

    <label>Number of Days:</label>
    <input type="number" id="days" min="1" required><br><br>

    <label>Number of Travelers:</label>
    <input type="number" id="travelers" min="1" required><br><br>

    <button type="submit">Book Now</button>
  </form>

  <h3>Booking Summary:</h3>
  <pre id="summary"></pre>

  <script>
    function bookTour(event) {
      event.preventDefault();

      // Get values using getElementById()
      let name = document.getElementById("name").value;
      let email = document.getElementById("email").value;
      let destination = document.getElementById("destination").value;
      let days = parseInt(document.getElementById("days").value);
      let travelers = parseInt(document.getElementById("travelers").value);

      // Price per day per person
      let prices = {
        "Ooty": 2000,
        "Goa": 3000,
        "Manali": 4000
      };

      // Calculate total cost
      let totalPrice = prices[destination] * days * travelers;

      // Display summary
      let summaryText = `Name: ${name}\nEmail: ${email}\nDestination: ${destination}\nDays: ${days}\nTravelers: ${travelers}\nTotal Price: ${totalPrice}`;
      document.getElementById("summary").textContent = summaryText;
    }
  </script>
</body>
</html>
