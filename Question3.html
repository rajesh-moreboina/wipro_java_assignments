<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Online Pooja Store Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    /* Invert the hamburger icon so it's visible on dark background */
    .navbar-toggler-icon {
      filter: invert(1);
    }
    /* Optional: change dropdown menu background to white for contrast */
    .dropdown-menu {
      background-color: white;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg" style="background-color: #f57c00;">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-white" href="#">Online Pooja Store</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#poojaNavbar" aria-controls="poojaNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="poojaNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active text-white" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white" href="#" id="productsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Products
          </a>
          <ul class="dropdown-menu" aria-labelledby="productsDropdown">
            <li><a class="dropdown-item" href="#">Pooja Kits</a></li>
            <li><a class="dropdown-item" href="#">Idols</a></li>
            <li><a class="dropdown-item" href="#">Flowers</a></li>
            <li><a class="dropdown-item" href="#">Incense Sticks</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Offers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Cart</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="#">Contact Us</a>
        </li>
      </ul>

      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search products" aria-label="Search" />
        <button class="btn btn-light" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
