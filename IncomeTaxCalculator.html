<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Tax Calculator</title>
</head>
<body>
  <script>
    // Input
    let fullName = prompt("Enter your Full Name:");
    let panNumber = prompt("Enter your PAN Number (10 characters, uppercase):");
    let dobInput = prompt("Enter your Date of Birth (YYYY-MM-DD):");
    let annualIncome = parseFloat(prompt("Enter your Annual Income (in ₹):"));

    // PAN Validation
    if (!panNumber || panNumber.length !== 10 || panNumber !== panNumber.toUpperCase()) {
      alert("Invalid PAN Number! It must be exactly 10 uppercase characters.");
      throw new Error("Invalid PAN Format");
    }

    // Calculate Age
    let dob = new Date(dobInput);
    let today = new Date();
    let age = today.getFullYear() - dob.getFullYear();
    let monthDiff = today.getMonth() - dob.getMonth();
    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
      age--;
    }

    // Calculate Tax
    let tax = 0;
    if (annualIncome <= 250000) {
      tax = 0;
    } else if (annualIncome <= 500000) {
      tax = 0.05 * annualIncome;
    } else if (annualIncome <= 1000000) {
      tax = 0.20 * annualIncome;
    } else {
      tax = 0.30 * annualIncome;
    }

    tax = Math.round(tax); // Round to nearest rupee

    // Display Output
    let result = `Name: ${fullName.toUpperCase()}
PAN: ${panNumber}
Age: ${age} years
Annual Income: ₹${annualIncome}
Calculated Tax: ₹${tax}`;

    alert(result);
    console.log(result); // For debugging in console
  </script>
</body>
</html>
